{% extends 'delivery/base.html' %}

{% block title %}حذف سائق{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto;">
    <div class="card" style="border-top: 4px solid var(--danger);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 3rem; color: var(--danger); margin-bottom: 1rem;">⚠️</div>
            <h2 style="font-weight: 700;">هل أنت متأكد؟</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">أنت على وشك حذف السائق <strong>"{{ delivery.name }}"</strong> نهائياً من النظام.</p>
        </div>
        
        <form method="post" style="display: flex; flex-direction: column; gap: 1rem;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">نعم، قم بالحذف</button>
            <a href="{% url 'delivery:delivery_list' %}" class="btn btn-secondary">تراجع</a>
        </form>
    </div>
</div>
{% endblock %}
